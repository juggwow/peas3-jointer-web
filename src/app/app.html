<div class="app-wrapper">
  <!-- Navbar -->
  <mat-toolbar color="primary" class="main-navbar">
    <div class="nav-container">
      <a routerLink="/" class="brand-link">
        <mat-icon class="brand-icon">bolt</mat-icon>
        <span class="brand-title">PEA Jointer Portal</span>
        <span class="brand-subtitle">| Cable Termination Records</span>
      </a>
      
      <span class="spacer"></span>
      
      <div class="nav-links">
        <button mat-button routerLink="/" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}">
          <mat-icon>dashboard</mat-icon>
          <span>หน้าหลัก</span>
        </button>
        <button mat-button routerLink="/records" routerLinkActive="active-nav">
          <mat-icon>list</mat-icon>
          <span>รายการติดตั้งทั้งหมด</span>
        </button>
        <button mat-raised-button color="accent" routerLink="/record/new" class="nav-new-btn">
          <mat-icon>add_circle</mat-icon>
          <span>บันทึกข้อมูลใหม่</span>
        </button>

        <!-- Profile Dropdown Menu -->
        <ng-container *ngIf="employeeId">
          <button mat-button [matMenuTriggerFor]="userMenu" class="nav-profile-btn">
            <mat-icon>account_circle</mat-icon>
            <span class="nav-profile-id">{{ employeeId }}</span>
            <mat-icon class="arrow-icon">arrow_drop_down</mat-icon>
          </button>
          <mat-menu #userMenu="matMenu" xPosition="before" class="pea-user-menu">
            <div class="menu-user-header">
              <mat-icon class="menu-user-icon">account_circle</mat-icon>
              <div class="menu-user-details">
                <span class="menu-user-label">รหัสพนักงาน</span>
                <span class="menu-user-id">{{ employeeId }}</span>
              </div>
            </div>
            <mat-divider></mat-divider>
            <button mat-menu-item routerLink="/edit-profile" class="pea-menu-item">
              <mat-icon class="menu-item-icon purple-icon">manage_accounts</mat-icon>
              <span>แก้ไขข้อมูล</span>
            </button>
            <button mat-menu-item (click)="logout()" class="pea-menu-item">
              <mat-icon class="menu-item-icon warn-icon">logout</mat-icon>
              <span class="text-warn">เปลี่ยนรหัสพนักงาน</span>
            </button>
          </mat-menu>
        </ng-container>
      </div>
    </div>
  </mat-toolbar>

  <!-- Router Outlet wrapper -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="footer-container">
      <p>© 2026 การไฟฟ้าส่วนภูมิภาค (PEA) • โครงการบันทึกตำแหน่งพิกัดติดตั้งสายเคเบิลใต้ดิน PEA-S3</p>
      <p class="footer-tech">Powered by Angular Material & Leaflet</p>
    </div>
  </footer>
</div>
